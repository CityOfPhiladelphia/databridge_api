[project]
name = "databridge-api"
version = "0.3.0"
description = "REST API for Accessing Databridge"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp[speedups]>=3.13.3",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.128.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "requests>=2.32.5"
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
databridge-api = { workspace = true }

[dependency-groups]
dev = [
    "databridge-api",
]
